# Blueprint do Render: https://render.com/docs/blueprint-spec
# Este serviço é só o PAINEL (Payload). O site público fica no Cloudflare Pages e nunca hiberna.
# No plano grátis o painel hiberna após 15 min sem acesso: ao abrir, ele leva cerca de 1 minuto para acordar.
services:
  - type: web
    name: nexis-blog-painel
    runtime: node
    plan: free
    region: ohio # a mesma região do banco no Neon (AWS US East 2, Ohio) reduz a latência
    branch: main
    autoDeploy: true
    # SEED_ON_BUILD=true só no primeiro deploy: cadastra os rascunhos iniciais. Depois apague a variável.
    buildCommand: npm ci && npm run migrate && if [ "$SEED_ON_BUILD" = "true" ]; then npm run seed; fi && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URI
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Endereço do painel. Se o Render der outro nome ao serviço, ajuste aqui (sem barra no fim).
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://nexis-blog-painel.onrender.com
      # Endereço público do blog (Cloudflare Pages)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://blog.iddnexis.com.br
      - key: NEXT_PUBLIC_MAIN_SITE_URL
        value: https://iddnexis.com.br
      # Deploy Hook do projeto no Cloudflare Pages (Settings › Builds › Deploy hooks)
      - key: PAGES_DEPLOY_HOOK_URL
        sync: false
      - key: SEED_ON_BUILD
        value: "true"
      - key: JOBS_AUTORUN
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: blog@iddnexis.com.br
