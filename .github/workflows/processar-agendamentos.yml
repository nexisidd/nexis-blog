# Acorda o painel (Render grátis hiberna) e processa a fila: publicações agendadas e convites.
# Com isso, um artigo agendado entra no ar em até ~1 hora depois do horário marcado.
# Configure em Settings › Secrets and variables › Actions:
#   PAINEL_URL  = https://nexis-blog-painel.onrender.com  (sem barra no fim)
#   CRON_SECRET = o mesmo valor da variável CRON_SECRET do Render
name: Processar agendamentos

on:
  schedule:
    - cron: '7 * * * *' # a cada hora, no minuto 7 (UTC)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acordar o painel e rodar a fila
        env:
          PAINEL_URL: ${{ secrets.PAINEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PAINEL_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets PAINEL_URL e CRON_SECRET."; exit 1
          fi
          # O painel pode levar ~1 minuto para acordar; tenta por até ~4 minutos.
          curl -fsS --retry 8 --retry-delay 30 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PAINEL_URL/api/payload-jobs/run"
